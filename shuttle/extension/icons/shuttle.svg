<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="24" fill="url(#g)"/>
  <!-- Shuttle/梭子 shape: a pointed diamond with a thread line -->
  <path d="M64 20 L100 64 L64 108 L28 64 Z" fill="none" stroke="white" stroke-width="5" stroke-linejoin="round"/>
  <line x1="64" y1="20" x2="64" y2="108" stroke="white" stroke-width="3" opacity="0.6"/>
  <line x1="28" y1="64" x2="100" y2="64" stroke="white" stroke-width="3" opacity="0.6"/>
  <!-- Thread trailing from shuttle -->
  <path d="M64 108 Q 50 118, 40 115 Q 30 112, 24 118" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <!-- Small bobbin circle in center -->
  <circle cx="64" cy="64" r="8" fill="white" opacity="0.9"/>
</svg>
