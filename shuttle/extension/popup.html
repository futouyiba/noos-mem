<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 320px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 16px; color: #1a1a1a; }
    h1 { font-size: 16px; font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    h1 span { font-size: 20px; }
    .status { font-size: 12px; color: #666; margin-bottom: 12px; padding: 8px; background: #f5f5f5; border-radius: 6px; }
    .status.error { background: #fef2f2; color: #dc2626; }
    .status.ok { background: #f0fdf4; color: #16a34a; }
    .preview { margin-bottom: 12px; }
    .preview label { font-size: 11px; font-weight: 600; text-transform: uppercase; color: #888; display: block; margin-bottom: 4px; }
    .preview .value { font-size: 13px; padding: 6px 8px; background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 4px; max-height: 60px; overflow-y: auto; word-break: break-word; }
    .actions { display: flex; gap: 8px; }
    button { flex: 1; padding: 8px 12px; border: none; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; transition: background 0.15s; }
    button.primary { background: #2563eb; color: white; }
    button.primary:hover { background: #1d4ed8; }
    button.primary:disabled { background: #93c5fd; cursor: not-allowed; }
    button.secondary { background: #f3f4f6; color: #374151; }
    button.secondary:hover { background: #e5e7eb; }
    .settings { margin-top: 12px; border-top: 1px solid #e5e7eb; padding-top: 12px; }
    .settings summary { font-size: 12px; color: #666; cursor: pointer; }
    .settings input { width: 100%; padding: 4px 8px; font-size: 12px; border: 1px solid #d1d5db; border-radius: 4px; margin-top: 4px; }
    .settings label { font-size: 11px; color: #888; display: block; margin-top: 8px; }
  </style>
</head>
<body>
  <h1><span>&#x1F9F5;</span> Shuttle</h1>

  <div id="status" class="status">Detecting conversation...</div>

  <div id="preview-section" style="display:none">
    <div class="preview">
      <label>Title</label>
      <div class="value" id="preview-title"></div>
    </div>
    <div class="preview">
      <label>Source</label>
      <div class="value" id="preview-source"></div>
    </div>
    <div class="preview">
      <label>Messages</label>
      <div class="value" id="preview-count"></div>
    </div>
  </div>

  <div class="actions">
    <button class="primary" id="send-btn" disabled>Send to Shuttle</button>
  </div>

  <details cla"settings">
    <summary>Settings</summary>
    <label>GitHub Token (for remote delivery)</label>
    <input type="password" id="gh-token" placeholder="ghp_...">
    <label>GitHub Repo (owner/repo)</label>
    <input type="text" id="gh-repo" placeholder="user/noos-mem">
    <label>Branch</label>
    <input type="text" id="gh-branch" placeholder="main" value="main">
    <button class="secondary" id="save-settings" style="margin-top:8px">Save</button>
  </details>

  <script src="popup.js"></script>
</body>
</html>
